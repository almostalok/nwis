version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nwis-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nwis_dev
    ports:
      - "5432:5432"
    volumes:
      - nwis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nwis_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nwis-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: nwis-api
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/nwis_dev?schema=public"
      PORT: 4000
      JWT_SECRET: "nwis_oil_stage01_jwt_development_secret_key_32bytes_min"
      NODE_ENV: "production"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: nwis-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  nwis_pgdata:
